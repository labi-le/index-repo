name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: install nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: fmt
        run: nix develop --command bash -c 'cargo fmt --check'

      # --all-targets trips a pre-existing useless_vec in old test code
      - name: clippy
        run: nix develop --command bash -c 'cargo clippy --lib --bins -- -D warnings'

      # tests/parity.rs and tests/gc_e2e.rs (CHROMA_TEST=1) need a live ChromaDB
      # server on the maintainer's LAN, unreachable from GitHub runners
      - name: test
        run: nix develop --command bash -c 'cargo test --lib'
